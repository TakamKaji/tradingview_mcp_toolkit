#:schema https://developers.openai.com/codex/config-schema.json

# GPT-6 Astra is the project default. CLI/session overrides still take precedence.
model = "gpt-6-astra"
model_reasoning_effort = "high"
model_verbosity = "low"

# Keep always-loaded repository guidance compact.
project_doc_max_bytes = 16384
